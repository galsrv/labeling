{% extends "base.html" %}

{% block title %}Шаблоны этикеток{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="mb-0">Шаблоны этикеток</h1>

  <a href="{{ url_for('web_create_label_form') }}" class="btn btn-sm btn-primary" data-requires-edit>
    Создать
  </a>
</div>

<div id="labelsFlash" class="alert d-none"></div>

<div id="labelsLoading" class="alert alert-secondary">
  Загрузка...
</div>

<div id="labelsError" class="alert alert-danger d-none"></div>

<div id="labelsEmpty" class="alert alert-info d-none">
  Шаблоны этикеток не найдены.
</div>

<div id="labelsTableWrap" class="table-responsive d-none">
  <table class="table table-striped table-hover align-middle">
    <colgroup>
      <col style="width: 6rem;">
      <col style="width: 55%;">
      <col style="width: 14rem;">
      <col style="width: 6rem;">
    </colgroup>

    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Наименование</th>
        <th>Драйвер</th>
        <th class="text-end"></th>
      </tr>
    </thead>

    <tbody id="labelsTableBody"></tbody>
  </table>
</div>

<div id="labelsPagination" class="mt-3 d-none"></div>

{% include "_pagination.html" %}

<script>
  const labelsApiUrl = '/api/v1/labels/';
  const labelsLoading = document.getElementById('labelsLoading');
  const labelsFlash = document.getElementById('labelsFlash');
  const labelsError = document.getElementById('labelsError');
  const labelsEmpty = document.getElementById('labelsEmpty');
  const labelsTableWrap = document.getElementById('labelsTableWrap');
  const labelsTableBody = document.getElementById('labelsTableBody');
  const labelsPagination = document.getElementById('labelsPagination');
  const labelEditUrlTemplate = '{{ url_for("web_update_label_form", label_id=0) }}';

  const initialParams = new URLSearchParams(window.location.search);
  let currentPage = Number(initialParams.get('page')) || 1;
  let currentSize = Number(initialParams.get('size')) || null;

  function setVisible(element, isVisible) {
    if (!element) return;
    element.classList.toggle('d-none', !isVisible);
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function buildLabelsUrl(page, size) {
    const params = new URLSearchParams({ page: String(page) });

    if (size) {
      params.set('size', String(size));
    }

    return `${labelsApiUrl}?${params.toString()}`;
  }

  function updateBrowserUrl(page, size) {
    const params = new URLSearchParams(window.location.search);
    params.set('page', String(page));

    if (size) {
      params.set('size', String(size));
    }

    window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
  }

  function getLabelEditUrl(labelId) {
    return labelEditUrlTemplate.replace(/0$/, String(labelId));
  }

  function showFlashMessage() {
    const raw = sessionStorage.getItem('labelsFlash');
    if (!raw) return;

    sessionStorage.removeItem('labelsFlash');

    try {
      const flash = JSON.parse(raw);
      labelsFlash.className = `alert ${flash.ok ? 'alert-success' : 'alert-danger'}`;
      labelsFlash.textContent = flash.message || (flash.ok ? 'Операция выполнена.' : 'Не удалось выполнить операцию.');
      setVisible(labelsFlash, true);
    } catch (_) {
      labelsFlash.className = 'alert alert-secondary';
      labelsFlash.textContent = raw;
      setVisible(labelsFlash, true);
    }
  }

  function renderLabels(labels) {
    labelsTableBody.innerHTML = '';

    for (const label of labels) {
      const labelName = escapeHtml(label.name);
      const driverName = escapeHtml(label.driver_name || '—');
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="fw-semibold">#${label.id}</td>
        <td>
          <a
            href="${getLabelEditUrl(label.id)}"
            class="fw-semibold text-truncate d-inline-block text-decoration-none text-reset"
            style="max-width: 50rem;"
            title="${labelName}"
          >
            ${labelName}
          </a>
        </td>
        <td class="text-nowrap">${driverName}</td>
        <td class="text-end">
          <a
            href="${getLabelEditUrl(label.id)}"
            class="btn btn-sm btn-outline-secondary px-3"
            title="Перейти"
            aria-label="Перейти"
          >
            &rsaquo;
          </a>
        </td>
      `;
      labelsTableBody.appendChild(row);
    }
  }

  async function loadLabels(page = currentPage) {
    setVisible(labelsLoading, true);
    setVisible(labelsError, false);
    setVisible(labelsEmpty, false);
    setVisible(labelsTableWrap, false);
    setVisible(labelsPagination, false);

    try {
      const response = await fetch(buildLabelsUrl(page, currentSize));
      if (!response.ok) {
        throw await window.apiClient.errorFromResponse(response, 'Не удалось загрузить список шаблонов этикеток.');
      }

      const pageData = await response.json();
      const labels = Array.isArray(pageData.items) ? pageData.items : [];

      if (pageData.pages > 0 && pageData.page > pageData.pages) {
        await loadLabels(pageData.pages);
        return;
      }

      currentPage = Number(pageData.page ?? page);
      currentSize = Number(pageData.size ?? currentSize);
      updateBrowserUrl(currentPage, currentSize);

      setVisible(labelsLoading, false);

      if (labels.length === 0) {
        setVisible(labelsEmpty, true);
        return;
      }

      renderLabels(labels);
      setVisible(labelsTableWrap, true);
      window.pagination.render(labelsPagination, pageData, loadLabels);
    } catch (error) {
      setVisible(labelsLoading, false);
      labelsError.textContent = error.message || 'Не удалось загрузить список шаблонов этикеток.';
      setVisible(labelsError, true);
    }
  }

  showFlashMessage();
  loadLabels();
</script>
{% endblock %}
