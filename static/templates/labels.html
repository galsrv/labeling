{% extends "base.html" %}

{% block title %}Шаблоны этикеток{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="mb-0">Шаблоны этикеток</h1>

  <a href="{{ url_for('web_create_label_form') }}" class="btn btn-sm btn-primary">
    Создать
  </a>
</div>

<div id="labelsFlash" class="alert d-none"></div>

<div id="labelsLoading" class="alert alert-secondary">
  Загрузка...
</div>

<div id="labelsError" class="alert alert-danger d-none"></div>

<div id="labelsEmpty" class="alert alert-info d-none">
  Шаблоны этикеток не найдены.
</div>

<div id="labelsTableWrap" class="table-responsive d-none">
  <table class="table table-striped table-hover align-middle">
    <colgroup>
      <col style="width: 6rem;">
      <col style="width: 55%;">
      <col style="width: 14rem;">
      <col style="width: 6rem;">
    </colgroup>

    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Наименование</th>
        <th>Драйвер</th>
        <th class="text-end"></th>
      </tr>
    </thead>

    <tbody id="labelsTableBody"></tbody>
  </table>
</div>

<script>
  const labelsApiUrl = '/api/v1/labels/';
  const labelsLoading = document.getElementById('labelsLoading');
  const labelsFlash = document.getElementById('labelsFlash');
  const labelsError = document.getElementById('labelsError');
  const labelsEmpty = document.getElementById('labelsEmpty');
  const labelsTableWrap = document.getElementById('labelsTableWrap');
  const labelsTableBody = document.getElementById('labelsTableBody');
  const labelEditUrlTemplate = '{{ url_for("web_update_label_form", label_id=0) }}';

  function setVisible(element, isVisible) {
    if (!element) return;
    element.classList.toggle('d-none', !isVisible);
  }

  function getLabelEditUrl(labelId) {
    return labelEditUrlTemplate.replace(/0$/, String(labelId));
  }

  function showFlashMessage() {
    const raw = sessionStorage.getItem('labelsFlash');
    if (!raw) return;

    sessionStorage.removeItem('labelsFlash');

    try {
      const flash = JSON.parse(raw);
      labelsFlash.className = `alert ${flash.ok ? 'alert-success' : 'alert-danger'}`;
      labelsFlash.textContent = flash.message || (flash.ok ? 'Операция выполнена.' : 'Не удалось выполнить операцию.');
      setVisible(labelsFlash, true);
    } catch (_) {
      labelsFlash.className = 'alert alert-secondary';
      labelsFlash.textContent = raw;
      setVisible(labelsFlash, true);
    }
  }

  function renderLabels(labels) {
    labelsTableBody.innerHTML = '';

    for (const label of labels) {
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="fw-semibold">#${label.id}</td>
        <td>
          <a
            href="${getLabelEditUrl(label.id)}"
            class="fw-semibold text-truncate d-inline-block text-decoration-none text-reset"
            style="max-width: 50rem;"
            title="${label.name}"
          >
            ${label.name}
          </a>
        </td>
        <td class="text-nowrap">${label.driver_name || '—'}</td>
        <td class="text-end">
          <a
            href="${getLabelEditUrl(label.id)}"
            class="btn btn-sm btn-outline-secondary px-3"
            title="Перейти"
            aria-label="Перейти"
          >
            &rsaquo;
          </a>
        </td>
      `;
      labelsTableBody.appendChild(row);
    }
  }

  async function loadLabels() {
    setVisible(labelsLoading, true);
    setVisible(labelsError, false);
    setVisible(labelsEmpty, false);
    setVisible(labelsTableWrap, false);

    try {
      const response = await fetch(labelsApiUrl);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const labels = await response.json();
      setVisible(labelsLoading, false);

      if (!Array.isArray(labels) || labels.length === 0) {
        setVisible(labelsEmpty, true);
        return;
      }

      renderLabels(labels);
      setVisible(labelsTableWrap, true);
    } catch (_) {
      setVisible(labelsLoading, false);
      labelsError.textContent = 'Не удалось загрузить список шаблонов этикеток.';
      setVisible(labelsError, true);
    }
  }

  showFlashMessage();
  loadLabels();
</script>
{% endblock %}
