{% extends "base.html" %}

{% block title %}Весы{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Весы</h1>

    <a href="{{ url_for('web_create_scales_form') }}" class="btn btn-sm btn-primary" data-requires-edit>
        Создать
    </a>
</div>

<div id="scalesFlash" class="alert d-none"></div>

<div id="scalesLoading" class="alert alert-secondary">
    Загрузка...
</div>

<div id="scalesError" class="alert alert-danger d-none"></div>

<div id="scalesEmpty" class="alert alert-info d-none">
    Весы не найдены.
</div>

<div id="scalesList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 d-none"></div>

<div id="scalesPagination" class="mt-3 d-none"></div>

{% include "_pagination.html" %}

<script>
  const scalesApiUrl = '/api/v1/scales/';
  const scalesLoading = document.getElementById('scalesLoading');
  const scalesFlash = document.getElementById('scalesFlash');
  const scalesError = document.getElementById('scalesError');
  const scalesEmpty = document.getElementById('scalesEmpty');
  const scalesList = document.getElementById('scalesList');
  const scalesPagination = document.getElementById('scalesPagination');
  const scalesEditUrlTemplate = '{{ url_for("web_update_scales_form", scales_id=0) }}';

  const initialParams = new URLSearchParams(window.location.search);
  let currentPage = Number(initialParams.get('page')) || 1;
  let currentSize = Number(initialParams.get('size')) || null;

  function setVisible(element, isVisible) {
    element.classList.toggle('d-none', !isVisible);
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function buildScalesUrl(page, size) {
    const params = new URLSearchParams({ page: String(page) });

    if (size) {
      params.set('size', String(size));
    }

    return `${scalesApiUrl}?${params.toString()}`;
  }

  function updateBrowserUrl(page, size) {
    const params = new URLSearchParams(window.location.search);
    params.set('page', String(page));

    if (size) {
      params.set('size', String(size));
    }

    window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
  }

  function getScalesEditUrl(scalesId) {
    return scalesEditUrlTemplate.replace(/0$/, String(scalesId));
  }

  function showFlashMessage() {
    const raw = sessionStorage.getItem('scalesFlash');
    if (!raw) return;

    sessionStorage.removeItem('scalesFlash');

    try {
      const flash = JSON.parse(raw);
      scalesFlash.className = `alert ${flash.ok ? 'alert-success' : 'alert-danger'}`;
      scalesFlash.textContent = flash.message || (flash.ok ? 'Операция выполнена.' : 'Не удалось выполнить операцию.');
      setVisible(scalesFlash, true);
    } catch (_) {
      scalesFlash.className = 'alert alert-secondary';
      scalesFlash.textContent = raw;
      setVisible(scalesFlash, true);
    }
  }

  function renderDriverName(scale) {
    return escapeHtml(scale.driver_name || '—');
  }

  function renderScales(scales) {
    scalesList.innerHTML = '';

    for (const scale of scales) {
      const scaleIp = escapeHtml(scale.ip);
      const scaleDescription = escapeHtml(scale.description || '');
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `
        <div class="card h-100 shadow-sm position-relative hover-card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <h5 class="card-title mb-2">⚖️ Весы #${scale.id}</h5>
            </div>

            <a
              href="${getScalesEditUrl(scale.id)}"
              class="stretched-link"
              aria-label="Открыть весы #${scale.id}"
            ></a>

            <dl class="row mb-0">
              <dt class="col-5">IP</dt>
              <dd class="col-7 text-break mb-2">${scaleIp}</dd>

              <dt class="col-5">Порт</dt>
              <dd class="col-7 mb-2">${scale.port}</dd>

              <dt class="col-5">Драйвер</dt>
              <dd class="col-7 mb-2">${renderDriverName(scale)}</dd>

              <dt class="col-5">Описание</dt>
              <dd class="col-7 mb-0">
                <span class="d-block text-truncate" style="max-width: 100%;" title="${scaleDescription}">
                  ${scaleDescription}
                </span>
              </dd>
            </dl>
          </div>
        </div>
      `;
      scalesList.appendChild(col);
    }
  }

  async function loadScales(page = currentPage) {
    setVisible(scalesLoading, true);
    setVisible(scalesError, false);
    setVisible(scalesEmpty, false);
    setVisible(scalesList, false);
    setVisible(scalesPagination, false);

    try {
      const response = await fetch(buildScalesUrl(page, currentSize));
      if (!response.ok) {
        throw await window.apiClient.errorFromResponse(response, 'Не удалось загрузить список весов.');
      }

      const pageData = await response.json();
      const scales = Array.isArray(pageData.items) ? pageData.items : [];

      if (pageData.pages > 0 && pageData.page > pageData.pages) {
        await loadScales(pageData.pages);
        return;
      }

      currentPage = Number(pageData.page ?? page);
      currentSize = Number(pageData.size ?? currentSize);
      updateBrowserUrl(currentPage, currentSize);

      setVisible(scalesLoading, false);

      if (scales.length === 0) {
        setVisible(scalesEmpty, true);
        return;
      }

      renderScales(scales);
      setVisible(scalesList, true);
      window.pagination.render(scalesPagination, pageData, loadScales);
    } catch (error) {
      setVisible(scalesLoading, false);
      scalesError.textContent = error.message || 'Не удалось загрузить список весов.';
      setVisible(scalesError, true);
    }
  }

  showFlashMessage();
  loadScales();
</script>
{% endblock %}
