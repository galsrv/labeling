{% extends "base.html" %}

{% block title %}Весы{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Весы</h1>

    <a href="{{ url_for('web_create_scales_form') }}" class="btn btn-sm btn-primary" data-requires-edit>
        Создать
    </a>
</div>

<div id="scalesFlash" class="alert d-none"></div>

<div id="scalesLoading" class="alert alert-secondary">
    Загрузка...
</div>

<div id="scalesError" class="alert alert-danger d-none"></div>

<div id="scalesEmpty" class="alert alert-info d-none">
    Весы не найдены.
</div>

<div id="scalesList" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4 d-none"></div>

<script>
  const scalesApiUrl = '/api/v1/scales/';
  const scalesLoading = document.getElementById('scalesLoading');
  const scalesFlash = document.getElementById('scalesFlash');
  const scalesError = document.getElementById('scalesError');
  const scalesEmpty = document.getElementById('scalesEmpty');
  const scalesList = document.getElementById('scalesList');
  const scalesEditUrlTemplate = '{{ url_for("web_update_scales_form", scales_id=0) }}';

  function setVisible(element, isVisible) {
    element.classList.toggle('d-none', !isVisible);
  }

  function getScalesEditUrl(scalesId) {
    return scalesEditUrlTemplate.replace(/0$/, String(scalesId));
  }

  function showFlashMessage() {
    const raw = sessionStorage.getItem('scalesFlash');
    if (!raw) return;

    sessionStorage.removeItem('scalesFlash');

    try {
      const flash = JSON.parse(raw);
      scalesFlash.className = `alert ${flash.ok ? 'alert-success' : 'alert-danger'}`;
      scalesFlash.textContent = flash.message || (flash.ok ? 'Операция выполнена.' : 'Не удалось выполнить операцию.');
      setVisible(scalesFlash, true);
    } catch (_) {
      scalesFlash.className = 'alert alert-secondary';
      scalesFlash.textContent = raw;
      setVisible(scalesFlash, true);
    }
  }

  function renderDriverName(scale) {
    return scale.driver_name || '—';
  }

  function renderScales(scales) {
    scalesList.innerHTML = '';

    for (const scale of scales) {
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `
        <div class="card h-100 shadow-sm position-relative hover-card">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start">
              <h5 class="card-title mb-2">⚖️ Весы #${scale.id}</h5>
            </div>

            <a
              href="${getScalesEditUrl(scale.id)}"
              class="stretched-link"
              aria-label="Открыть весы #${scale.id}"
            ></a>

            <dl class="row mb-0">
              <dt class="col-5">IP</dt>
              <dd class="col-7 text-break mb-2">${scale.ip}</dd>

              <dt class="col-5">Порт</dt>
              <dd class="col-7 mb-2">${scale.port}</dd>

              <dt class="col-5">Драйвер</dt>
              <dd class="col-7 mb-2">${renderDriverName(scale)}</dd>

              <dt class="col-5">Описание</dt>
              <dd class="col-7 mb-0">
                <span class="d-block text-truncate" style="max-width: 100%;" title="${scale.description}">
                  ${scale.description}
                </span>
              </dd>
            </dl>
          </div>
        </div>
      `;
      scalesList.appendChild(col);
    }
  }

  async function loadScales() {
    setVisible(scalesLoading, true);
    setVisible(scalesError, false);
    setVisible(scalesEmpty, false);
    setVisible(scalesList, false);

    try {
      const response = await fetch(scalesApiUrl);
      if (!response.ok) {
        throw new Error(`HTTP ${response.status}`);
      }

      const scales = await response.json();
      setVisible(scalesLoading, false);

      if (!Array.isArray(scales) || scales.length === 0) {
        setVisible(scalesEmpty, true);
        return;
      }

      renderScales(scales);
      setVisible(scalesList, true);
    } catch (error) {
      setVisible(scalesLoading, false);
      scalesError.textContent = 'Не удалось загрузить список весов.';
      setVisible(scalesError, true);
    }
  }

  showFlashMessage();
  loadScales();
</script>
{% endblock %}
