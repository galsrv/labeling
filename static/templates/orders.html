{% extends "base.html" %}

{% block title %}Задания на производство{% endblock %}

{% block content %}
<h1 class="mb-4">Задания на производство</h1>

<div id="ordersLoading" class="alert alert-secondary">
  Загрузка...
</div>

<div id="ordersError" class="alert alert-danger d-none"></div>

<div id="ordersEmpty" class="alert alert-info d-none">
  Задания не найдены.
</div>

<div id="ordersTableWrap" class="table-responsive d-none">
  <table class="table table-striped table-hover align-middle">
    <colgroup>
      <col style="width: 6rem;">
      <col style="width: 8.5rem;">
      <col style="width: 40%;">
      <col style="width: 9.5rem;">
      <col style="width: 15rem;">
      <col style="width: 15rem;">
      <col style="width: 16rem;">
      <col style="width: 8.5rem;">
    </colgroup>

    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Дата</th>
        <th>Продукт</th>
        <th>Статус</th>
        <th class="text-end">Заказано (кг)</th>
        <th class="text-end">Произведено (кг)</th>
        <th>Прогресс</th>
        <th class="text-end"></th>
      </tr>
    </thead>

    <tbody id="ordersTableBody"></tbody>
  </table>
</div>

<div id="ordersPagination" class="mt-3 d-none"></div>

{% include "_pagination.html" %}

<script>
  const ordersApiUrl = '/api/v1/orders/';
  const ordersLoading = document.getElementById('ordersLoading');
  const ordersError = document.getElementById('ordersError');
  const ordersEmpty = document.getElementById('ordersEmpty');
  const ordersTableWrap = document.getElementById('ordersTableWrap');
  const ordersTableBody = document.getElementById('ordersTableBody');
  const ordersPagination = document.getElementById('ordersPagination');
  const orderExecutionUrlTemplate = '{{ url_for("read_order", order_id=0) }}';

  const initialParams = new URLSearchParams(window.location.search);
  let currentPage = Number(initialParams.get('page')) || 1;
  let currentSize = Number(initialParams.get('size')) || null;

  function setVisible(element, isVisible) {
    if (!element) return;
    element.classList.toggle('d-none', !isVisible);
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function buildOrdersUrl(page, size) {
    const params = new URLSearchParams({ page: String(page) });

    if (size) {
      params.set('size', String(size));
    }

    return `${ordersApiUrl}?${params.toString()}`;
  }

  function updateBrowserUrl(page, size) {
    const params = new URLSearchParams(window.location.search);
    params.set('page', String(page));

    if (size) {
      params.set('size', String(size));
    }

    window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
  }

  function getOrderExecutionUrl(orderId) {
    return orderExecutionUrlTemplate.replace(/0$/, String(orderId));
  }

  function formatDate(value) {
    if (!value) return '—';
    const [year, month, day] = String(value).split('-');
    if (!year || !month || !day) return value;
    return `${day}.${month}.${year}`;
  }

  function formatKg(value) {
    const number = Number(value || 0);
    return number.toFixed(3);
  }

  function getProgressPct(order) {
    const ordered = Number(order.ordered_kg || 0);
    const produced = Number(order.produced_kg || 0);
    if (ordered <= 0) return 0;
    const pct = Math.round((produced / ordered) * 100);
    return Math.max(0, Math.min(100, pct));
  }

  function normalizeStatus(status) {
    if (status === 'CREATED' || status === 'Создано') return 'CREATED';
    if (status === 'ACTIVE' || status === 'Активно') return 'ACTIVE';
    if (status === 'CLOSED' || status === 'Закрыто') return 'CLOSED';
    return String(status || '');
  }

  function getProgressBarClass(status) {
    const normalizedStatus = normalizeStatus(status);
    if (normalizedStatus === 'CLOSED') return 'bg-success';
    if (normalizedStatus === 'ACTIVE') return '';
    return 'bg-secondary';
  }

  function getStatusBadge(status) {
    const normalizedStatus = normalizeStatus(status);
    if (normalizedStatus === 'CREATED') return '<span class="badge text-bg-secondary">Создано</span>';
    if (normalizedStatus === 'ACTIVE') return '<span class="badge text-bg-primary">Активно</span>';
    if (normalizedStatus === 'CLOSED') return '<span class="badge text-bg-success">Закрыто</span>';
    return `<span class="badge text-bg-dark">${escapeHtml(status)}</span>`;
  }

  function renderOrders(orders) {
    ordersTableBody.innerHTML = '';

    for (const order of orders) {
      const progressPct = getProgressPct(order);
      const itemName = escapeHtml(order.item?.name || '—');
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="fw-semibold">#${order.id}</td>
        <td class="text-nowrap">${formatDate(order.production_date)}</td>
        <td>
          <div class="fw-semibold text-truncate" style="max-width: 42rem;" title="${itemName}">
            ${itemName}
          </div>
        </td>
        <td class="text-nowrap">${getStatusBadge(order.status)}</td>
        <td class="text-end text-nowrap">${formatKg(order.ordered_kg)}</td>
        <td class="text-end text-nowrap">${formatKg(order.produced_kg)}</td>
        <td>
          <div class="d-flex align-items-center gap-2">
            <div class="progress flex-grow-1" role="progressbar"
                 aria-valuenow="${progressPct}" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-bar ${getProgressBarClass(order.status)}" style="width: ${progressPct}%"></div>
            </div>
            <span class="text-nowrap small">${progressPct}%</span>
          </div>
        </td>
        <td class="text-end text-nowrap">
          ${normalizeStatus(order.status) === 'CLOSED'
            ? '<a class="btn btn-sm btn-outline-secondary disabled" aria-disabled="true" data-requires-edit>Запустить</a>'
            : `<a href="${getOrderExecutionUrl(order.id)}" class="btn btn-sm btn-primary" data-requires-edit>Запустить</a>`}
        </td>
      `;
      ordersTableBody.appendChild(row);
    }
  }

  async function loadOrders(page = currentPage) {
    setVisible(ordersLoading, true);
    setVisible(ordersError, false);
    setVisible(ordersEmpty, false);
    setVisible(ordersTableWrap, false);
    setVisible(ordersPagination, false);

    try {
      const response = await fetch(buildOrdersUrl(page, currentSize));
      if (!response.ok) {
        throw await window.apiClient.errorFromResponse(response, 'Не удалось загрузить список заданий.');
      }

      const pageData = await response.json();
      const orders = Array.isArray(pageData.items) ? pageData.items : [];

      if (pageData.pages > 0 && pageData.page > pageData.pages) {
        await loadOrders(pageData.pages);
        return;
      }

      currentPage = Number(pageData.page ?? page);
      currentSize = Number(pageData.size ?? currentSize);
      updateBrowserUrl(currentPage, currentSize);

      setVisible(ordersLoading, false);

      if (orders.length === 0) {
        setVisible(ordersEmpty, true);
        return;
      }

      renderOrders(orders);
      setVisible(ordersTableWrap, true);
      window.pagination.render(ordersPagination, pageData, loadOrders);
    } catch (error) {
      setVisible(ordersLoading, false);
      ordersError.textContent = error.message || 'Не удалось загрузить список заданий.';
      setVisible(ordersError, true);
    }
  }

  loadOrders();
</script>
{% endblock %}
