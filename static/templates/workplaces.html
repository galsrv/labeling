{% extends "base.html" %}

{% block title %}Рабочие места{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="mb-0">Рабочие места</h1>
</div>

<div id="workplacesLoading" class="alert alert-secondary">
    Загрузка...
</div>

<div id="workplacesError" class="alert alert-danger d-none"></div>

<div id="workplacesEmpty" class="alert alert-info d-none">
    Рабочие места не найдены.
</div>

<div id="workplacesList" class="row row-cols-1 g-4 d-none"></div>

<div id="workplacesPagination" class="mt-3 d-none"></div>

{% include "_pagination.html" %}

<script>
  const workplacesApiUrl = '/api/v1/workplaces/';
  const workplacesLoading = document.getElementById('workplacesLoading');
  const workplacesError = document.getElementById('workplacesError');
  const workplacesEmpty = document.getElementById('workplacesEmpty');
  const workplacesList = document.getElementById('workplacesList');
  const workplacesPagination = document.getElementById('workplacesPagination');

  const initialParams = new URLSearchParams(window.location.search);
  let currentPage = Number(initialParams.get('page')) || 1;
  let currentSize = Number(initialParams.get('size')) || null;

  function setVisible(element, isVisible) {
    element.classList.toggle('d-none', !isVisible);
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function buildWorkplacesUrl(page, size) {
    const params = new URLSearchParams({ page: String(page) });

    if (size) {
      params.set('size', String(size));
    }

    return `${workplacesApiUrl}?${params.toString()}`;
  }

  function updateBrowserUrl(page, size) {
    const params = new URLSearchParams(window.location.search);
    params.set('page', String(page));

    if (size) {
      params.set('size', String(size));
    }

    window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
  }

  function getCookie(name) {
    const prefix = `${name}=`;
    const cookies = document.cookie ? document.cookie.split(';') : [];

    for (const rawCookie of cookies) {
      const cookie = rawCookie.trim();
      if (cookie.startsWith(prefix)) {
        return decodeURIComponent(cookie.slice(prefix.length));
      }
    }

    return null;
  }

  function setCookie(name, value) {
    document.cookie = `${name}=${encodeURIComponent(value)}; path=/; max-age=31536000; samesite=lax`;
  }

  function renderDevice(device, emptyText) {
    if (!device) {
      return `<span class="text-muted">${emptyText}</span>`;
    }

    const description = escapeHtml(device.description || '—');
    const ip = escapeHtml(device.ip || '—');

    return `
      <span class="d-block text-truncate" title="${description}">
        ${description} (${ip})
      </span>
    `;
  }

  function renderWorkplaces(workplaces) {
    workplacesList.innerHTML = '';

    for (const wp of workplaces) {
      const workplaceDescription = escapeHtml(wp.description || '');
      const col = document.createElement('div');
      col.className = 'col';
      col.innerHTML = `
        <div class="card h-100 shadow-sm workplace-card" data-workplace-id="${wp.id}">
          <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-3">
              <h5 class="card-title mb-0">🖥️ Рабочее место #${wp.id}</h5>
              <span class="workplace-linked-indicator d-none" title="Текущее рабочее место">🔗</span>
            </div>

            <dl class="row mb-0">
              <dt class="col-5">Описание</dt>
              <dd class="col-7 mb-2">
                <span class="d-block text-truncate" title="${workplaceDescription}">
                  ${workplaceDescription}
                </span>
              </dd>

              <dt class="col-5">Весы</dt>
              <dd class="col-7 mb-2">${renderDevice(wp.scales, 'не назначены')}</dd>

              <dt class="col-5">Принтер 1</dt>
              <dd class="col-7 mb-2">${renderDevice(wp.printer1, 'не назначен')}</dd>

              <dt class="col-5">Принтер 2</dt>
              <dd class="col-7 mb-2">${renderDevice(wp.printer2, 'не назначен')}</dd>
            </dl>
          </div>

          <div class="card-footer bg-transparent border-0 pt-0">
            <div class="d-flex gap-2">
              <button type="button" class="btn btn-sm btn-primary workplace-bind-btn">
                Привязать
              </button>
              <a href="#" class="btn btn-sm btn-outline-primary" data-requires-edit>Изменить</a>
              <a href="#" class="btn btn-sm btn-outline-danger" data-requires-edit>Удалить</a>
            </div>
          </div>
        </div>
      `;
      workplacesList.appendChild(col);
    }
  }

  function refreshLinkedWorkplaceState() {
    const linkedWorkplaceId = getCookie('workplace_id');
    const cards = document.querySelectorAll('.workplace-card');

    for (const card of cards) {
      const workplaceId = card.dataset.workplaceId;
      const indicator = card.querySelector('.workplace-linked-indicator');
      const bindButton = card.querySelector('.workplace-bind-btn');

      if (workplaceId === linkedWorkplaceId) {
        indicator.classList.remove('d-none');
        bindButton.classList.add('d-none');
      } else {
        indicator.classList.add('d-none');
        bindButton.classList.remove('d-none');
      }
    }
  }

  function bindWorkplaceButtons() {
    const bindButtons = document.querySelectorAll('.workplace-bind-btn');
    for (const button of bindButtons) {
      button.addEventListener('click', (event) => {
        const card = event.currentTarget.closest('.workplace-card');
        if (!card) return;

        setCookie('workplace_id', card.dataset.workplaceId);
        refreshLinkedWorkplaceState();
      });
    }
  }

  async function loadWorkplaces(page = currentPage) {
    setVisible(workplacesLoading, true);
    setVisible(workplacesError, false);
    setVisible(workplacesEmpty, false);
    setVisible(workplacesList, false);
    setVisible(workplacesPagination, false);

    try {
      const response = await fetch(buildWorkplacesUrl(page, currentSize));
      if (!response.ok) {
        throw await window.apiClient.errorFromResponse(response, 'Не удалось загрузить список рабочих мест.');
      }

      const pageData = await response.json();
      const workplaces = Array.isArray(pageData.items) ? pageData.items : [];

      if (pageData.pages > 0 && pageData.page > pageData.pages) {
        await loadWorkplaces(pageData.pages);
        return;
      }

      currentPage = Number(pageData.page ?? page);
      currentSize = Number(pageData.size ?? currentSize);
      updateBrowserUrl(currentPage, currentSize);

      setVisible(workplacesLoading, false);

      if (workplaces.length === 0) {
        setVisible(workplacesEmpty, true);
        return;
      }

      renderWorkplaces(workplaces);
      bindWorkplaceButtons();
      refreshLinkedWorkplaceState();
      setVisible(workplacesList, true);
      window.pagination.render(workplacesPagination, pageData, loadWorkplaces);
    } catch (error) {
      setVisible(workplacesLoading, false);
      workplacesError.textContent = error.message || 'Не удалось загрузить список рабочих мест.';
      setVisible(workplacesError, true);
    }
  }

  loadWorkplaces();
</script>
{% endblock %}
