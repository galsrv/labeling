{% extends "base.html" %}

{% block title %}Пользователи{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h1 class="mb-0">Пользователи</h1>
  <a href="{{ url_for('web_create_user_form') }}" class="btn btn-primary" data-requires-edit>
    Создать
  </a>
</div>

<div id="usersSuccess" class="alert alert-success d-none"></div>
<div id="usersError" class="alert alert-danger d-none"></div>
<div id="usersLoading" class="alert alert-secondary">Загрузка...</div>
<div id="usersEmpty" class="alert alert-info d-none">Пользователи не найдены.</div>

<div id="usersTableWrapper" class="table-responsive d-none">
  <table class="table table-hover align-middle">
    <colgroup>
      <col style="width: 22%;">
      <col style="width: 18%;">
      <col style="width: 18%;">
      <col style="width: 12%;">
      <col style="width: 30%;">
    </colgroup>
    <thead class="table-dark">
      <tr>
        <th>Юзернейм</th>
        <th>Имя</th>
        <th>Фамилия</th>
        <th>Активен</th>
        <th>Роль</th>
      </tr>
    </thead>
    <tbody id="usersTableBody"></tbody>
  </table>
</div>

<div id="usersPagination" class="mt-3 d-none"></div>

{% include "_pagination.html" %}

<script>
  const usersApiUrl = '/api/v1/users/';
  const userEditUrlTemplate = '{{ url_for("web_update_user_form", user_id=0) }}';

  const usersSuccess = document.getElementById('usersSuccess');
  const usersError = document.getElementById('usersError');
  const usersLoading = document.getElementById('usersLoading');
  const usersEmpty = document.getElementById('usersEmpty');
  const usersTableWrapper = document.getElementById('usersTableWrapper');
  const usersTableBody = document.getElementById('usersTableBody');
  const usersPagination = document.getElementById('usersPagination');

  const initialParams = new URLSearchParams(window.location.search);
  let currentPage = Number(initialParams.get('page')) || 1;
  let currentSize = Number(initialParams.get('size')) || null;

  function setVisible(element, isVisible) {
    element.classList.toggle('d-none', !isVisible);
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#39;');
  }

  function buildUsersUrl(page, size) {
    const params = new URLSearchParams({ page: String(page) });

    if (size) {
      params.set('size', String(size));
    }

    return `${usersApiUrl}?${params.toString()}`;
  }

  function updateBrowserUrl(page, size) {
    const params = new URLSearchParams(window.location.search);
    params.set('page', String(page));

    if (size) {
      params.set('size', String(size));
    }

    window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
  }

  function getUserEditUrl(userId) {
    return userEditUrlTemplate.replace(/0$/, String(userId));
  }

  function showFlashMessage() {
    const raw = sessionStorage.getItem('usersFlash');
    if (!raw) return;

    sessionStorage.removeItem('usersFlash');

    try {
      const flash = JSON.parse(raw);
      if (flash.ok) {
        usersSuccess.textContent = flash.message || 'Операция выполнена.';
        setVisible(usersSuccess, true);
      } else {
        usersError.textContent = flash.message || 'Не удалось выполнить операцию.';
        setVisible(usersError, true);
      }
    } catch (_) {
      usersSuccess.textContent = raw;
      setVisible(usersSuccess, true);
    }
  }

  function renderUsers(users) {
    usersTableBody.innerHTML = '';

    for (const user of users) {
      const row = document.createElement('tr');
      row.role = 'button';
      row.classList.add(user.is_active ? 'table-light' : 'table-secondary');
      row.innerHTML = `
        <td class="fw-semibold">${escapeHtml(user.username)}</td>
        <td>${escapeHtml(user.first_name)}</td>
        <td>${escapeHtml(user.last_name)}</td>
        <td>
          <span class="badge text-bg-${user.is_active ? 'success' : 'secondary'}">
            ${user.is_active ? 'Да' : 'Нет'}
          </span>
        </td>
        <td>${escapeHtml(user.role?.name ?? '—')}</td>
      `;
      row.addEventListener('click', () => {
        window.location.href = getUserEditUrl(user.id);
      });
      usersTableBody.appendChild(row);
    }
  }

  async function loadUsers(page = currentPage) {
    setVisible(usersLoading, true);
    setVisible(usersError, false);
    setVisible(usersEmpty, false);
    setVisible(usersTableWrapper, false);
    setVisible(usersPagination, false);

    try {
      const response = await fetch(buildUsersUrl(page, currentSize));
      if (!response.ok) {
        throw await window.apiClient.errorFromResponse(response, 'Не удалось загрузить список пользователей.');
      }

      const pageData = await response.json();
      const users = Array.isArray(pageData.items) ? pageData.items : [];

      if (pageData.pages > 0 && pageData.page > pageData.pages) {
        await loadUsers(pageData.pages);
        return;
      }

      currentPage = Number(pageData.page ?? page);
      currentSize = Number(pageData.size ?? currentSize);
      updateBrowserUrl(currentPage, currentSize);

      setVisible(usersLoading, false);

      if (users.length === 0) {
        setVisible(usersEmpty, true);
        return;
      }

      renderUsers(users);
      setVisible(usersTableWrapper, true);
      window.pagination.render(usersPagination, pageData, loadUsers);
    } catch (error) {
      setVisible(usersLoading, false);
      usersError.textContent = error.message || 'Не удалось загрузить список пользователей.';
      setVisible(usersError, true);
    }
  }

  showFlashMessage();
  loadUsers();
</script>
{% endblock %}
