{% extends "base.html" %}

{% block title %}Продукты{% endblock %}

{% block content %}
<h1 class="mb-4">Продукты</h1>

<div id="itemsLoading" class="alert alert-secondary">
    Загрузка...
</div>

<div id="itemsError" class="alert alert-danger d-none"></div>

<div id="itemsEmpty" class="alert alert-info d-none">
    Продукты не найдены.
</div>

<div id="itemsTableWrapper" class="table-responsive d-none">
    <table class="table table-striped table-hover align-middle">
        <colgroup>
            <col style="width: 5rem;">
            <col style="width: 35%;">
            <col style="width: 8rem;">
            <col style="width: 10rem;">
            <col style="width: 14rem;">
            <col style="width: 10rem;">
        </colgroup>

        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Наименование</th>
                <th class="text-center">Фикс вес</th>
                <th class="text-end">Вес</th>
                <th>GTIN</th>
                <th class="text-end">Штук в коробе</th>
            </tr>
        </thead>

        <tbody id="itemsTableBody"></tbody>
    </table>
</div>

<div id="itemsPagination" class="mt-3 d-none"></div>

{% include "_pagination.html" %}

<script>
  const itemsApiUrl = '/api/v1/items/';
  const itemsLoading = document.getElementById('itemsLoading');
  const itemsError = document.getElementById('itemsError');
  const itemsEmpty = document.getElementById('itemsEmpty');
  const itemsTableWrapper = document.getElementById('itemsTableWrapper');
  const itemsTableBody = document.getElementById('itemsTableBody');
  const itemsPagination = document.getElementById('itemsPagination');

  const initialParams = new URLSearchParams(window.location.search);
  let currentPage = Number(initialParams.get('page')) || 1;
  let currentSize = Number(initialParams.get('size')) || null;

  function formatWeight(value) {
    const number = Number(value ?? 0);
    return `${number.toFixed(3)} кг`;
  }

  function setVisible(element, isVisible) {
    element.classList.toggle('d-none', !isVisible);
  }

  function escapeHtml(value) {
    return String(value ?? '')
      .replaceAll('&', '&amp;')
      .replaceAll('<', '&lt;')
      .replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;')
      .replaceAll("'", '&#039;');
  }

  function buildItemsUrl(page, size) {
    const params = new URLSearchParams({ page: String(page) });

    if (size) {
      params.set('size', String(size));
    }

    return `${itemsApiUrl}?${params.toString()}`;
  }

  function updateBrowserUrl(page, size) {
    const params = new URLSearchParams(window.location.search);
    params.set('page', String(page));

    if (size) {
      params.set('size', String(size));
    }

    window.history.replaceState({}, '', `${window.location.pathname}?${params.toString()}`);
  }

  function renderItems(items) {
    itemsTableBody.innerHTML = '';

    for (const item of items) {
      const itemName = escapeHtml(item.name);
      const row = document.createElement('tr');
      row.innerHTML = `
        <td class="fw-semibold">#${item.id}</td>
        <td>
          <div class="fw-semibold text-truncate" style="max-width: 40rem;" title="${itemName}">
            ${itemName}
          </div>
        </td>
        <td class="text-center">
          <input type="checkbox" class="form-check-input" disabled ${item.fixed_weight ? 'checked' : ''}>
        </td>
        <td class="text-end text-nowrap">${formatWeight(item.nominal_weight)}</td>
        <td class="text-nowrap">${item.gtin}</td>
        <td class="text-end">${item.units_per_box}</td>
      `;
      itemsTableBody.appendChild(row);
    }
  }

  async function loadItems(page = currentPage) {
    setVisible(itemsLoading, true);
    setVisible(itemsError, false);
    setVisible(itemsEmpty, false);
    setVisible(itemsTableWrapper, false);
    setVisible(itemsPagination, false);

    try {
      const response = await fetch(buildItemsUrl(page, currentSize));
      if (!response.ok) {
        throw await window.apiClient.errorFromResponse(response, 'Не удалось загрузить список продуктов.');
      }

      const pageData = await response.json();
      const items = Array.isArray(pageData.items) ? pageData.items : [];

      if (pageData.pages > 0 && pageData.page > pageData.pages) {
        await loadItems(pageData.pages);
        return;
      }

      currentPage = Number(pageData.page ?? page);
      currentSize = Number(pageData.size ?? currentSize);
      updateBrowserUrl(currentPage, currentSize);

      setVisible(itemsLoading, false);

      if (items.length === 0) {
        setVisible(itemsEmpty, true);
        return;
      }

      renderItems(items);
      setVisible(itemsTableWrapper, true);
      window.pagination.render(itemsPagination, pageData, loadItems);
    } catch (error) {
      setVisible(itemsLoading, false);
      itemsError.textContent = error.message || 'Не удалось загрузить список продуктов.';
      setVisible(itemsError, true);
    }
  }

  loadItems();
</script>
{% endblock %}
