{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header">
        <div class="fw-semibold">Вход в систему</div>
      </div>

      <form id="loginForm" autocomplete="off">
        <div class="card-body">
          <div id="loginError" class="alert alert-danger d-none"></div>

          <div class="mb-3">
            <label for="usernameInput" class="form-label">Юзернейм</label>
            <input
              id="usernameInput"
              class="form-control"
              type="text"
              maxlength="15"
              autocomplete="username"
              required
            >
          </div>

          <div>
            <label for="passwordInput" class="form-label">Пароль</label>
            <input
              id="passwordInput"
              class="form-control"
              type="password"
              maxlength="255"
              autocomplete="current-password"
              required
            >
          </div>
        </div>

        <div class="card-footer bg-transparent d-flex justify-content-end">
          <button id="loginBtn" type="submit" class="btn btn-primary">
            Войти
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<script>
  const loginApiUrl = '/api/v1/auth/login';
  const rootUrl = '{{ url_for("site_root") }}';

  const loginForm = document.getElementById('loginForm');
  const loginError = document.getElementById('loginError');
  const loginBtn = document.getElementById('loginBtn');
  const usernameInput = document.getElementById('usernameInput');
  const passwordInput = document.getElementById('passwordInput');

  function setVisible(element, isVisible) {
    element.classList.toggle('d-none', !isVisible);
  }

  function showError(message) {
    loginError.textContent = message;
    setVisible(loginError, true);
  }

  async function parseApiError(response, fallbackMessage) {
    try {
      const data = await response.json();
      if (data && typeof data === 'object') {
        if (typeof data.detail === 'string') {
          return data.detail;
        }
        if (Array.isArray(data.detail) && data.detail.length > 0) {
          const first = data.detail[0];
          if (first && typeof first.msg === 'string') {
            return first.msg;
          }
        }
        if (typeof data.message === 'string') {
          return data.message;
        }
      }
    } catch (_) {
      // ignore parsing error
    }

    return fallbackMessage;
  }

  loginForm.addEventListener('submit', async (event) => {
    event.preventDefault();
    setVisible(loginError, false);
    loginBtn.disabled = true;

    try {
      const response = await fetch(loginApiUrl, {
        method: 'POST',
        credentials: 'same-origin',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          username: usernameInput.value.trim(),
          password: passwordInput.value,
        }),
      });

      if (!response.ok) {
        const message = await parseApiError(response, 'Не удалось войти в систему.');
        showError(message);
        return;
      }

      window.location.href = rootUrl;
    } catch (_) {
      showError('Не удалось войти в систему.');
    } finally {
      loginBtn.disabled = false;
    }
  });
</script>
{% endblock %}
