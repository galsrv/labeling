<script>
  window.apiClient = window.apiClient || (() => {
    async function parseError(response, fallbackMessage) {
      try {
        const data = await response.json();
        if (data && typeof data === 'object') {
          if (typeof data.detail === 'string') {
            return data.detail;
          }
          if (Array.isArray(data.detail) && data.detail.length > 0) {
            const first = data.detail[0];
            if (first && typeof first.msg === 'string') {
              return first.msg;
            }
          }
          if (typeof data.message === 'string') {
            return data.message;
          }
        }
      } catch (_) {
        // ignore parsing error
      }

      if (response.status === 403) {
        return 'Недостаточно полномочий на выполнение операции';
      }

      return fallbackMessage;
    }

    async function errorFromResponse(response, fallbackMessage) {
      const message = await parseError(response, fallbackMessage);
      const error = new Error(message);
      error.status = response.status;
      return error;
    }

    return { parseError, errorFromResponse };
  })();

  window.authClient = window.authClient || (() => {
    const nativeFetch = window.fetch.bind(window);
    const meApiUrl = '/api/v1/auth/me';
    const refreshApiUrl = '/api/v1/auth/tokens_refresh';
    const logoutApiUrl = '/api/v1/auth/logout';
    const loginUrl = '{{ url_for("web_user_login") }}';
    const loginPath = new URL(loginUrl, window.location.origin).pathname;
    const publicPaths = new Set([loginPath]);
    const pageRules = [
      { prefix: '/web/auth/me', authenticated: true },
      { prefix: '/web/items', view: 'is_items_view_permitted', edit: 'is_items_edit_permitted' },
      { prefix: '/web/labels', view: 'is_labels_view_permitted', edit: 'is_labels_edit_permitted' },
      { prefix: '/web/sgtins', view: 'is_sgtins_view_permitted', edit: 'is_sgtins_edit_permitted' },
      { prefix: '/web/orders', view: 'is_orders_view_permitted', edit: 'is_orders_edit_permitted' },
      { prefix: '/web/printers', view: 'is_printers_view_permitted', edit: 'is_printers_edit_permitted' },
      { prefix: '/web/scales', view: 'is_scales_view_permitted', edit: 'is_scales_edit_permitted' },
      { prefix: '/web/workplaces', view: 'is_workplaces_view_permitted', edit: 'is_workplaces_edit_permitted' },
      { prefix: '/web/users', view: 'is_users_view_permitted', edit: 'is_users_edit_permitted' },
      { prefix: '/web', authenticated: true },
    ];
    let currentUser = undefined;
    let currentUserPromise = null;
    let refreshPromise = null;
    let currentPageCanEdit = false;

    function deleteCookie(name) {
      document.cookie = `${encodeURIComponent(name)}=; path=/; max-age=0; SameSite=Lax`;
    }

    function clearTokens() {
      // Removes old JS-readable cookies left from the pre-HttpOnly implementation.
      deleteCookie('access_token');
      deleteCookie('refresh_token');
      currentUser = null;
      currentUserPromise = null;
    }

    async function refreshTokens() {
      if (refreshPromise) {
        return await refreshPromise;
      }

      refreshPromise = (async () => {
        const response = await nativeFetch(refreshApiUrl, {
          method: 'POST',
          credentials: 'same-origin',
        });

        if (!response.ok) {
          clearTokens();
          return false;
        }

        currentUser = undefined;
        return true;
      })();

      try {
        return await refreshPromise;
      } finally {
        refreshPromise = null;
      }
    }

    async function loadCurrentUser() {
      let response = await nativeFetch(meApiUrl, {
        credentials: 'same-origin',
      });

      if (response.status === 401) {
        const refreshed = await refreshTokens();
        if (!refreshed) {
          return null;
        }
        response = await nativeFetch(meApiUrl, {
          credentials: 'same-origin',
        });
      }

      if (!response.ok) {
        return null;
      }

      return await response.json();
    }

    async function fetchCurrentUser(force = false) {
      if (!force && currentUser !== undefined) {
        return currentUser;
      }

      if (!force && currentUserPromise) {
        return await currentUserPromise;
      }

      currentUserPromise = loadCurrentUser();

      try {
        currentUser = await currentUserPromise;
        return currentUser;
      } finally {
        currentUserPromise = null;
      }
    }

    async function logout() {
      try {
        await nativeFetch(logoutApiUrl, {
          method: 'POST',
          credentials: 'same-origin',
        });
      } finally {
        clearTokens();
        window.location.reload();
      }
    }

    function shouldRetryAfterRefresh(input) {
      const url = new URL(typeof input === 'string' ? input : input.url, window.location.origin);
      return (
        url.origin === window.location.origin
        && url.pathname.startsWith('/api/v1/')
        && !url.pathname.startsWith('/api/v1/auth/')
      );
    }

    async function authFetch(input, init) {
      const response = await nativeFetch(input, init);

      if (response.status !== 401 || !shouldRetryAfterRefresh(input)) {
        return response;
      }

      const refreshed = await refreshTokens();
      if (!refreshed) {
        return response;
      }

      return await nativeFetch(input, init);
    }

    function hasPermission(user, permissionName) {
      if (!permissionName) return true;
      return Boolean(user?.role?.[permissionName]);
    }

    function getPageRule(pathname = window.location.pathname) {
      return pageRules.find((rule) => pathname.startsWith(rule.prefix)) || null;
    }

    function isCreatePath(pathname = window.location.pathname) {
      return pathname.endsWith('/create') || pathname.includes('/create/');
    }

    function canViewPath(user, pathname = window.location.pathname) {
      if (publicPaths.has(pathname)) return true;

      const rule = getPageRule(pathname);
      if (!rule) return Boolean(user);
      if (rule.authenticated) return Boolean(user);

      return hasPermission(user, rule.view);
    }

    function canEditPath(user, pathname = window.location.pathname) {
      const rule = getPageRule(pathname);
      if (!rule || !rule.edit) return false;
      return hasPermission(user, rule.edit);
    }

    function applyControlPermissions(user) {
      currentPageCanEdit = canEditPath(user);
      document.body.classList.toggle('auth-can-edit', currentPageCanEdit);

      for (const element of document.querySelectorAll('[data-edit-control]')) {
        element.disabled = !currentPageCanEdit;
      }
    }

    function applyNavbarPermissions(user) {
      for (const element of document.querySelectorAll('[data-nav-permission]')) {
        element.classList.toggle('d-none', !hasPermission(user, element.dataset.navPermission));
      }

      for (const group of document.querySelectorAll('[data-nav-group]')) {
        const visibleChildren = group.querySelectorAll('[data-nav-permission]:not(.d-none)');
        group.classList.toggle('d-none', visibleChildren.length === 0);
      }
    }

    function showPageContent() {
      document.body.classList.remove('auth-pending');
      document.getElementById('pageContent')?.classList.remove('d-none');
      document.getElementById('authAccessDenied')?.classList.add('d-none');
    }

    function showAccessDenied() {
      document.body.classList.remove('auth-pending');
      document.getElementById('pageContent')?.classList.add('d-none');
      document.getElementById('authAccessDenied')?.classList.remove('d-none');
    }

    function handlePageAccess(user) {
      const pathname = window.location.pathname;
      let isAllowed = true;

      if (publicPaths.has(pathname)) {
        showPageContent();
        document.dispatchEvent(new CustomEvent('auth:ready', {
          detail: { user, canEdit: currentPageCanEdit, isAllowed },
        }));
        return isAllowed;
      }

      if (!user) {
        window.location.href = loginUrl;
        return false;
      }

      applyControlPermissions(user);

      if (isCreatePath(pathname) && !canEditPath(user, pathname)) {
        isAllowed = false;
        showAccessDenied();
        document.dispatchEvent(new CustomEvent('auth:ready', {
          detail: { user, canEdit: currentPageCanEdit, isAllowed },
        }));
        return isAllowed;
      }

      if (!canViewPath(user, pathname)) {
        isAllowed = false;
        showAccessDenied();
        document.dispatchEvent(new CustomEvent('auth:ready', {
          detail: { user, canEdit: currentPageCanEdit, isAllowed },
        }));
        return isAllowed;
      }

      showPageContent();
      document.dispatchEvent(new CustomEvent('auth:ready', {
        detail: { user, canEdit: currentPageCanEdit, isAllowed },
      }));
      return isAllowed;
    }

    return {
      fetchCurrentUser,
      authFetch,
      logout,
      clearTokens,
      hasPermission,
      applyNavbarPermissions,
      handlePageAccess,
      canEditCurrentPage: () => currentPageCanEdit,
    };
  })();

  window.fetch = window.authClient.authFetch;

  (async () => {
    const loginLink = document.getElementById('navbarLoginLink');
    const userLink = document.getElementById('navbarUserLink');
    const logoutBtn = document.getElementById('navbarLogoutBtn');

    function setVisible(element, isVisible) {
      if (!element) return;
      element.classList.toggle('d-none', !isVisible);
    }

    function showUnauthorized() {
      setVisible(loginLink, true);
      setVisible(userLink, false);
      setVisible(logoutBtn, false);
    }

    try {
      const user = await window.authClient.fetchCurrentUser();
      window.authClient.applyNavbarPermissions(user);

      if (!user) {
        showUnauthorized();
        window.authClient.handlePageAccess(user);
        return;
      }

      userLink.textContent = `${user.first_name ?? ''} ${user.last_name ?? ''}`.trim() || user.username;
      setVisible(loginLink, false);
      setVisible(userLink, true);
      setVisible(logoutBtn, true);
      window.authClient.handlePageAccess(user);
    } catch (_) {
      showUnauthorized();
      window.authClient.applyNavbarPermissions(null);
      window.authClient.handlePageAccess(null);
    }

    logoutBtn?.addEventListener('click', () => {
      window.authClient.logout();
    });
  })();
</script>
